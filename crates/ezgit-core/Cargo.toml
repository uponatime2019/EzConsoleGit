[package]
name = "ezgit-core"
version = "1.0.0"
description = "GUI-free core services for EzGitRs: git CLI, AI client, settings and platform helpers."
authors = ["uponatime2019"]
edition = "2021"
rust-version = "1.77"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
regex = "1"
once_cell = "1"
base64 = "0.22"
arboard = { version = "3", default-features = false }
